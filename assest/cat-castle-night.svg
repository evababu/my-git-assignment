<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".6" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#3a3a42"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#dcdce6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#dcdce6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9aa4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9a9aa4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9a9aa4" stop-opacity="0"/>
    </linearGradient>

    <!-- One cat soldier. Colours come from --u (uniform) and --f (fur) -->
    <g id="cat">
      <path d="M-12 -16 Q-36 -20 -28 -50" fill="none" stroke="var(--f)" stroke-width="6" stroke-linecap="round"/>
      <rect x="-10" y="-14" width="8" height="14" fill="#1a1a1f"/>
      <rect x="2" y="-14" width="8" height="14" fill="#1a1a1f"/>
      <rect x="-12" y="-42" width="24" height="30" rx="3" fill="var(--u)"/>
      <circle cx="0" cy="-34" r="2" fill="#c9a227"/>
      <circle cx="0" cy="-26" r="2" fill="#c9a227"/>
      <polygon points="-14,-58 -12,-76 -3,-64" fill="var(--f)"/>
      <polygon points="14,-58 12,-76 3,-64" fill="var(--f)"/>
      <circle cx="0" cy="-54" r="14" fill="var(--f)"/>
      <path d="M-15 -56 A15 15 0 0 1 15 -56 Z" fill="#4b4b55"/>
      <rect x="-16" y="-58" width="32" height="3" fill="#33333b"/>
      <ellipse cx="0" cy="-74" rx="3" ry="7" fill="var(--u)" stroke="#fff" stroke-opacity=".3"/>
      <rect x="2" y="-54" width="4" height="5" rx="1" fill="#ffd84a"/>
      <rect x="8" y="-54" width="4" height="5" rx="1" fill="#ffd84a"/>
      <g class="arm">
        <rect x="8" y="-40" width="16" height="7" rx="3" fill="var(--u)"/>
        <rect x="22" y="-44" width="3" height="14" fill="#c9a227"/>
        <rect x="23" y="-110" width="2.5" height="66" fill="#e8e8f0"/>
      </g>
    </g>
  </defs>

  <style>
    .s  { fill:#fff; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:1 } }
    .win { fill:#ffc85a; animation: flick 2.4s ease-in-out infinite; }
    @keyframes flick { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    .arm { transform-origin: 14px -37px; animation: swing .9s ease-in-out infinite alternate; }
    @keyframes swing { from { transform: rotate(-25deg) } to { transform: rotate(40deg) } }
    .spark { fill:#fff; animation: zap .9s ease-in-out infinite alternate; }
    @keyframes zap { 0%,60% { opacity:0 } 100% { opacity:1 } }
    .flag { animation: wave 2s ease-in-out infinite alternate; transform-origin: 800px 160px; }
    @keyframes wave { from { transform: skewY(-6deg) } to { transform: skewY(6deg) } }
    .mist { animation: drift 10s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-40px) } to { transform: translateX(40px) } }
  </style>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Twinkling stars -->
  <g>
    <circle class="s" cx="80"   cy="60"  r="2"   style="animation-delay:-0.2s"/>
    <circle class="s" cx="170"  cy="180" r="1.5" style="animation-delay:-1.1s"/>
    <circle class="s" cx="260"  cy="90"  r="2.2" style="animation-delay:-2.0s"/>
    <circle class="s" cx="340"  cy="250" r="1.4" style="animation-delay:-0.7s"/>
    <circle class="s" cx="420"  cy="40"  r="1.8" style="animation-delay:-1.6s"/>
    <circle class="s" cx="500"  cy="150" r="2"   style="animation-delay:-2.5s"/>
    <circle class="s" cx="580"  cy="70"  r="1.5" style="animation-delay:-0.4s"/>
    <circle class="s" cx="650"  cy="220" r="1.6" style="animation-delay:-1.9s"/>
    <circle class="s" cx="720"  cy="110" r="2.3" style="animation-delay:-0.9s"/>
    <circle class="s" cx="900"  cy="60"  r="1.7" style="animation-delay:-2.2s"/>
    <circle class="s" cx="970"  cy="170" r="2"   style="animation-delay:-1.3s"/>
    <circle class="s" cx="1040" cy="90"  r="1.4" style="animation-delay:-0.1s"/>
    <circle class="s" cx="1110" cy="260" r="2.1" style="animation-delay:-1.7s"/>
    <circle class="s" cx="1180" cy="130" r="1.6" style="animation-delay:-2.8s"/>
    <circle class="s" cx="1260" cy="50"  r="2"   style="animation-delay:-0.6s"/>
    <circle class="s" cx="1330" cy="210" r="1.5" style="animation-delay:-1.4s"/>
    <circle class="s" cx="1420" cy="100" r="2.2" style="animation-delay:-2.3s"/>
    <circle class="s" cx="1500" cy="280" r="1.6" style="animation-delay:-0.8s"/>
    <circle class="s" cx="1560" cy="60"  r="1.8" style="animation-delay:-1.8s"/>
    <circle class="s" cx="40"   cy="320" r="1.5" style="animation-delay:-2.6s"/>
    <circle class="s" cx="230"  cy="380" r="1.8" style="animation-delay:-0.3s"/>
    <circle class="s" cx="1450" cy="400" r="1.5" style="animation-delay:-1.0s"/>
    <circle class="s" cx="1330" cy="340" r="2"   style="animation-delay:-2.1s"/>
    <circle class="s" cx="120"  cy="470" r="1.4" style="animation-delay:-1.5s"/>
  </g>

  <!-- Moon -->
  <circle cx="1300" cy="170" r="190" fill="url(#moonGlow)"/>
  <circle cx="1300" cy="170" r="62" fill="#d8d8e0"/>
  <circle cx="1280" cy="155" r="11" fill="#b5b5bf"/>
  <circle cx="1325" cy="185" r="14" fill="#b5b5bf"/>
  <circle cx="1303" cy="205" r="7"  fill="#b5b5bf"/>

  <!-- Castle -->
  <g fill="#0d0d11">
    <rect x="520" y="600" width="560" height="200"/>
    <rect x="470" y="470" width="80" height="330"/>
    <rect x="1050" y="470" width="80" height="330"/>
    <rect x="600" y="520" width="60" height="280"/>
    <rect x="940" y="520" width="60" height="280"/>
    <rect x="710" y="330" width="180" height="470"/>
    <polygon points="460,470 510,380 560,470"/>
    <polygon points="1040,470 1090,380 1140,470"/>
    <polygon points="700,330 800,190 900,330"/>
    <polygon points="595,520 630,450 665,520"/>
    <polygon points="935,520 970,450 1005,520"/>
  </g>
  <!-- battlements -->
  <g stroke="#0d0d11" stroke-width="14" stroke-dasharray="14 14">
    <line x1="520" y1="593" x2="1080" y2="593"/>
    <line x1="470" y1="463" x2="550" y2="463"/>
    <line x1="1050" y1="463" x2="1130" y2="463"/>
    <line x1="710" y1="323" x2="890" y2="323"/>
  </g>
  <!-- flag -->
  <line x1="800" y1="190" x2="800" y2="140" stroke="#0d0d11" stroke-width="3"/>
  <polygon class="flag" points="800,140 840,152 800,164" fill="#4a4a55"/>
  <!-- glowing windows -->
  <rect class="win" x="790" y="380" width="20" height="38" rx="10"/>
  <rect class="win" x="750" y="470" width="14" height="28" rx="7" style="animation-delay:-.8s"/>
  <rect class="win" x="836" y="470" width="14" height="28" rx="7" style="animation-delay:-1.6s"/>
  <rect class="win" x="502" y="530" width="16" height="32" rx="8" style="animation-delay:-.4s"/>
  <rect class="win" x="1082" y="530" width="16" height="32" rx="8" style="animation-delay:-1.2s"/>
  <rect class="win" x="622" y="580" width="14" height="26" rx="7" style="animation-delay:-2s"/>
  <rect class="win" x="964" y="580" width="14" height="26" rx="7" style="animation-delay:-.2s"/>
  <!-- gate -->
  <path d="M760 800 V720 A40 40 0 0 1 840 720 V800 Z" fill="#040406"/>

  <!-- Ground -->
  <path d="M0 900 V790 Q200 770 400 790 T800 785 T1200 790 T1600 780 V900 Z" fill="#09090c"/>

  <!-- Cat soldiers fighting (blue vs red uniforms) -->
  <use href="#cat" transform="translate(250,850) scale(2)"   style="--u:#35456b;--f:#8d8d96"/>
  <use href="#cat" transform="translate(390,850) scale(-2,2)" style="--u:#6b2b2b;--f:#c8c8d0"/>
  <circle class="spark" cx="320" cy="745" r="9"/>

  <use href="#cat" transform="translate(560,860) scale(1.8)"    style="--u:#35456b;--f:#5c5c66"/>
  <use href="#cat" transform="translate(690,860) scale(-1.8,1.8)" style="--u:#6b2b2b;--f:#a89f94"/>
  <circle class="spark" cx="625" cy="770" r="8" style="animation-delay:-.4s"/>

  <use href="#cat" transform="translate(910,860) scale(1.8)"    style="--u:#6b2b2b;--f:#c8c8d0"/>
  <use href="#cat" transform="translate(1040,860) scale(-1.8,1.8)" style="--u:#35456b;--f:#8d8d96"/>
  <circle class="spark" cx="975" cy="770" r="8" style="animation-delay:-.2s"/>

  <use href="#cat" transform="translate(1210,850) scale(2)"   style="--u:#35456b;--f:#a89f94"/>
  <use href="#cat" transform="translate(1350,850) scale(-2,2)" style="--u:#6b2b2b;--f:#5c5c66"/>
  <circle class="spark" cx="1280" cy="745" r="9" style="animation-delay:-.6s"/>

  <!-- Drifting mist -->
  <rect class="mist" x="-100" y="720" width="1800" height="160" fill="url(#mist)"/>
</svg>